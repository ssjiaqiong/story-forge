# =============================================================================
# StoryForge 远程单机编排（app + postgres）
#
#   应用镜像来自腾讯云 TCR：服务器上不编译、不需要 Maven / Node / 源码，
#   只需要本文件 + .env：
#       docker compose pull app
#       docker compose up -d --no-build
#
#   换版本：改下面的 image 标签，或部署时用环境变量覆盖
#       APP_IMAGE=ccr.ccs.tencentyun.com/jiaqiong/story-forge:v1.2.2 docker compose up -d
#
#   数据落 ./data/（pg / files / covers / logs），整目录可备份。
# =============================================================================
services:

  app:
    image: ${APP_IMAGE:-ccr.ccs.tencentyun.com/jiaqiong/story-forge:v1.2.2}
    container_name: storyforge-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-storyforge}
      DB_USER: ${DB_USER:-storyforge}
      DB_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}

      STORYFORGE_JWT_SECRET: ${STORYFORGE_JWT_SECRET:?请设置 STORYFORGE_JWT_SECRET（>= 32 字节）}
      STORYFORGE_SECRET_KEY: ${STORYFORGE_SECRET_KEY:?请设置 STORYFORGE_SECRET_KEY（随机值，且勿变更）}

      STORYFORGE_ADMIN_USERNAME: ${STORYFORGE_ADMIN_USERNAME:-admin}
      STORYFORGE_ADMIN_PASSWORD: ${STORYFORGE_ADMIN_PASSWORD:-Admin@123456}
      STORYFORGE_ADMIN_FORCE_CHANGE: ${STORYFORGE_ADMIN_FORCE_CHANGE:-true}

      STORYFORGE_REGISTRATION_ENABLED: "false"

      STORYFORGE_FILE_ROOT: /data/files
      STORYFORGE_COVER_ROOT: /data/covers
      LOG_PATH: /app/logs
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx640m}
    volumes:
      - ./data/files:/data/files
      - ./data/covers:/data/covers
      - ./data/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - storyforge

  postgres:
    image: postgres:16-alpine
    container_name: storyforge-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-storyforge}
      POSTGRES_USER: ${DB_USER:-storyforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      TZ: Asia/Shanghai
    # 2G 内存机器：限制 PG 内存占用，避免与 JVM 抢内存
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-storyforge} -d ${DB_NAME:-storyforge}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - storyforge

networks:
  storyforge:
    driver: bridge

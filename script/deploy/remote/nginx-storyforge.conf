# StoryForge HTTPS gateway
#   www.jq888.cn / jq888.cn  ->  127.0.0.1:8080 (storyforge app container)
#   cert: /etc/nginx/ssl/www.jq888.cn_bundle.crt (2026-10-26 ~ 2027-01-23)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- HTTP -> HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name www.jq888.cn jq888.cn;
    return 301 https://$host$request_uri;
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.jq888.cn jq888.cn;

    ssl_certificate     /etc/nginx/ssl/www.jq888.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/www.jq888.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # SSE / AI streaming: send chunks immediately
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 10s;
        # AI 大纲生成是同步长请求（单次 60~300 秒，两次尝试最坏 600 秒），
        # 这里必须不小于前端超时，否则 Nginx 先断、前端只拿到 504
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}

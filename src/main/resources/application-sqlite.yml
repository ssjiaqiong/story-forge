# =============================================================================
# SQLite 运行环境（桌面单机版 / 本地演示）
#
# 启动：SPRING_PROFILES_ACTIVE=sqlite java -jar app.jar
#
# 版本要求：SQLite 3.35+（sqlite-jdbc 3.47.2.0 内置 3.47.2，满足）
#
# 与 PostgreSQL 的差异及原因：
#   1. 没有服务端进程，数据库就是 data/ 下的一个文件，删掉即回到初始状态。
#   2. 单写者模型：WAL 允许并发读、串行写。所以连接池开小、busy_timeout 放宽，
#      避免后台任务（如 AI 用量记账的 REQUIRES_NEW 事务）与前台写入互相等待超时。
#   3. 时间列是 TEXT，读写由 SqliteLocalDateTimeTypeHandler 负责，业务代码无感知。
# =============================================================================
spring:
  datasource:
    # 路径优先级：SQLITE_PATH 环境变量 > storyforge.home（桌面版为 exe 同级的 data/，
    # 开发态为 ./data）。不要依赖进程工作目录——开始菜单 / 快捷方式启动时 CWD 不确定。
    url: jdbc:sqlite:${SQLITE_PATH:${storyforge.home:./data}/storyforge.db}?busy_timeout=10000&journal_mode=WAL&foreign_keys=on
    username:
    password:
    driver-class-name: org.sqlite.JDBC
    hikari:
      pool-name: storyforge-sqlite-pool
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: PRAGMA busy_timeout = 10000

  flyway:
    enabled: true
    locations: classpath:db/migration/sqlite
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history

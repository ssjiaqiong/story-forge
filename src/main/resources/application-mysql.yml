# =============================================================================
# MySQL 运行环境
#
# 启动：SPRING_PROFILES_ACTIVE=mysql java -jar app.jar
# 或与业务 profile 叠加：SPRING_PROFILES_ACTIVE=prod,mysql
#
# 版本要求：MySQL 8.0.13+（基线里用函数索引实现「逻辑删除下的部分唯一索引」）
#           或 MariaDB 10.2+
#
# 该库需提前建好，只要求字符集为 utf8mb4；表结构由 Flyway 在启动时创建。
#   CREATE DATABASE storyforge DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:storyforge}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: storyforge-mysql-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history

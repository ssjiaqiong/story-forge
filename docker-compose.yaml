# =============================================================================
# StoryForge 一键运行（镜像版）
#
#   app      = ccr.ccs.tencentyun.com/jiaqiong/story-forge（前端 + 后端同一镜像）
#   postgres = postgres:16-alpine（唯一中间件）
#
#   数据全部落在本文件同级的 ./data/ 下，整个目录拷走即完成迁移/备份：
#       ./data/pg      PostgreSQL 数据目录
#       ./data/files   上传的素材文件
#       ./data/covers  小说封面
#       ./data/logs    应用日志
#
#   使用：
#       docker compose up -d            # 拉镜像并启动
#       docker compose logs -f app      # 看启动日志
#       docker compose down             # 停止（数据保留在 ./data）
#
#   换版本：改下面的 image 标签，或临时覆盖
#       IMAGE_TAG=v1.2.4 docker compose up -d
#
#   自定义配置：在同级目录建一个 .env（已被 .gitignore 忽略），写
#       DB_PASSWORD=...
#       STORYFORGE_JWT_SECRET=...（>= 32 字节）
#       STORYFORGE_SECRET_KEY=...（AI Key 加密主密钥，首次启动后不可更换）
#   compose 会自动读取该文件做变量替换。
#
#   ⚠️ 下面的默认密钥只够本机试跑。对外提供服务前务必在 .env 里换成随机值，
#      尤其是 STORYFORGE_SECRET_KEY —— 它一旦更换，已保存的 AI API Key 将无法解密。
# =============================================================================
name: storyforge

services:

  app:
    image: ccr.ccs.tencentyun.com/jiaqiong/story-forge:${IMAGE_TAG:-v1.2.4}
    container_name: storyforge-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai

      # 数据库：服务名 postgres 即容器网络内的主机名
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-storyforge}
      DB_USER: ${DB_USER:-storyforge}
      DB_PASSWORD: ${DB_PASSWORD:-storyforge}

      # 安全密钥
      STORYFORGE_JWT_SECRET: ${STORYFORGE_JWT_SECRET:-storyforge-local-jwt-secret-key-please-change-32bytes}
      STORYFORGE_SECRET_KEY: ${STORYFORGE_SECRET_KEY:-storyforge-local-crypto-secret-please-change}

      # 初始超级管理员（仅首次启动、账号不存在时创建；默认要求首登改密）
      STORYFORGE_ADMIN_USERNAME: ${STORYFORGE_ADMIN_USERNAME:-admin}
      STORYFORGE_ADMIN_PASSWORD: ${STORYFORGE_ADMIN_PASSWORD:-Admin@123456}
      STORYFORGE_ADMIN_FORCE_CHANGE: ${STORYFORGE_ADMIN_FORCE_CHANGE:-true}

      # 关闭自助注册（需求约束）
      STORYFORGE_REGISTRATION_ENABLED: "false"

      # 文件落盘位置，与下方 volumes 一一对应
      STORYFORGE_FILE_ROOT: /data/files
      STORYFORGE_COVER_ROOT: /data/covers
      LOG_PATH: /app/logs
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx640m}
    volumes:
      - ./data/files:/data/files
      - ./data/covers:/data/covers
      - ./data/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - storyforge

  postgres:
    image: postgres:16-alpine
    container_name: storyforge-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-storyforge}
      POSTGRES_USER: ${DB_USER:-storyforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-storyforge}
      TZ: Asia/Shanghai
    # 小内存机器（2G）下限制 PG 占用，避免和 JVM 抢内存
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-storyforge} -d ${DB_NAME:-storyforge}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - storyforge

networks:
  storyforge:
    driver: bridge
